[project]
name = "cute-display-installer"
# The release's git tag, as the app image's (hatch-vcs).
dynamic = ["version"]
description = "Install Cute Display on a Habity bedside clock, and go back to Habity's firmware."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "esptool>=5.1,<6",
    "pyserial>=3.5,<4",
    "textual>=6,<8",
    "tzdata>=2025.1",
    "tzlocal>=5,<6",
]

[project.scripts]
cute-display = "cute_display_installer.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "../.."

[tool.hatch.build.targets.wheel]
packages = ["src/cute_display_installer"]
