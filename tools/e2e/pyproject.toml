[project]
name = "cute-display-e2e"
version = "0"
description = "Cute Display from the outside: scenarios a person would play, on the simulator through its console, and the authority and the stubs the device's test image uses."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
    "cute-display-link",
    "pytest>=8,<9",
]

[tool.uv.sources]
cute-display-link = { path = "../link", editable = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cute_display_e2e"]

[tool.pytest.ini_options]
testpaths = ["scenarios"]
markers = ["device: quick enough to run on the device, where time passes at its own pace"]
