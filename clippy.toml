# In tests a panic IS the failure report — unwrap freely there.
# (Clippy finds this file by walking up from each crate's manifest dir, so it
# will cover the firmware crate too once that exists outside the workspace.)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
