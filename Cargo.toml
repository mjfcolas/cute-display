# Host workspace: every crate that builds and tests on a stock toolchain.
# `firmware` targets xtensa-esp32s3-espidf and is excluded; it depends on these by path.
[workspace]
resolver = "2"
members = ["src/engine/hal", "src/engine/drivers", "src/engine/domain", "src/engine/infrastructure", "src/engine/ui", "src/maintenance", "src/hwtest", "src/app", "src/simulator"]
exclude = ["src/firmware"]

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
string_slice = "warn"
