[package]
name = "radar"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The radar app: the aircraft around one place, from adsb.fi, and the airports near it."

[lints]
workspace = true

[dependencies]
conf_text = { path = "../../engine/conf_text" }
domain = { path = "../../engine/domain" }
ui = { path = "../../engine/ui" }
embedded-graphics = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
domain_testing = { path = "../../engine/domain_testing" }
hal = { path = "../../engine/hal" }
