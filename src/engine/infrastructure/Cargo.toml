[package]
name = "infrastructure"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The domain's contracts, implemented on the HAL."

[lints]
workspace = true

[dependencies]
conf_text = { path = "../conf_text" }
domain = { path = "../domain" }
hal = { path = "../hal" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
domain_testing = { path = "../domain_testing" }
hal_testing = { path = "../hal_testing" }
