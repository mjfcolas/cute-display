[package]
name = "ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The presentation: the shell that hosts the app in front, the system app's screen, the toolkit apps draw with, and how the controls are read. Draws on any DrawTarget; knows no hardware."

[lints]
workspace = true

[dependencies]
domain = { path = "../domain" }
embedded-graphics = "0.8"

[dev-dependencies]
ui_testing = { path = "../ui_testing" }
domain_testing = { path = "../domain_testing" }
hal = { path = "../hal" }
