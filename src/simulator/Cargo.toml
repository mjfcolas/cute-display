[package]
name = "simulator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The app image on a computer: the panel in a window, the controls on the keyboard, the SD card in a directory, the Internet through the computer's."

[lints]
workspace = true

[features]
default = ["alarm", "weather", "radar"]
alarm = ["catalog/alarm"]
weather = ["catalog/weather"]
radar = ["catalog/radar"]

[dependencies]
app = { path = "../app" }
drivers = { path = "../engine/drivers" }
hal = { path = "../engine/hal" }
infrastructure = { path = "../engine/infrastructure" }
maintenance = { path = "../maintenance" }
catalog = { path = "../catalog", default-features = false }
embedded-graphics = "0.8"
env_logger = "0.11"
log = "0.4"
minifb = "0.28"
ureq = "3"

[dev-dependencies]
domain = { path = "../engine/domain" }
ui = { path = "../engine/ui" }
forecast = { path = "../libs/forecast" }
alarm = { path = "../apps/alarm" }
weather = { path = "../apps/weather" }
radar = { path = "../apps/radar" }

[[example]]
name = "app_screen"
required-features = ["alarm", "weather", "radar"]
