[package]
name = "sound_files"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The sound files an app plays from its directory, MP3 or WAV alike: listed, played round and round at the speaker's rate, at a volume; and the chime, played without a file."

[lints]
workspace = true

[dependencies]
domain = { path = "../../engine/domain" }
log = "0.4"
mbop3 = { version = "0.1", features = ["alloc"] }

[dev-dependencies]
domain_testing = { path = "../../engine/domain_testing" }
