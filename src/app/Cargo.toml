[package]
name = "app"
# Not the release's: the app image takes its version from the git tag (src/image.rs).
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The app image on any hardware that keeps the HAL's contracts: its threads, and how the layers are wired."

[lints]
workspace = true

[dependencies]
domain = { path = "../engine/domain" }
infrastructure = { path = "../engine/infrastructure" }
hal = { path = "../engine/hal" }
ui = { path = "../engine/ui" }
embedded-graphics = "0.8"
log = "0.4"

[dev-dependencies]
catalog = { path = "../catalog" }
domain_testing = { path = "../engine/domain_testing" }
hal_testing = { path = "../engine/hal_testing" }
