[package]
# The name and version the images describe themselves with (their esp_app_desc), which
# the installer's flash/layout.py reads; the version is the app image's, `app::VERSION`.
name = "cute-display"
version = "2026.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
resolver = "2"
description = "The images flashed on the device: the board's pin map, and one binary per image."

# Outside the host workspace: this crate only builds for xtensa-esp32s3-espidf.

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[lib]
name = "firmware"

[[bin]]
name = "app"
path = "src/bin/app.rs"
harness = false

[[bin]]
name = "hwtest"
path = "src/bin/hwtest.rs"
harness = false

[dependencies]
log = "0.4"
esp-idf-svc = "0.52.1"
app = { path = "../app" }
hal = { path = "../hal" }
drivers = { path = "../drivers" }
hwtest = { path = "../hwtest" }
maintenance = { path = "../maintenance" }

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
overflow-checks = true

[profile.dev]
debug = true
opt-level = "z"
